name: multi_jobs


on:
    workflow_dispatch:
        inputs:
            environments:
                description: "Choose an Environment"
                required: true
                type: choice
                options:
                  - stagging
                  - production

jobs:
    job_1:
        runs-on: ubuntu-latest

        steps:
          - run: "echo Job ${{ github.job }}"

    job_2:
        runs-on: ubuntu-latest

        needs: job_1

        steps:
          - run: "echo Job ${{ github.job }}"

    
    job_3: 
        runs-on: ubuntu-latest

        needs: job_1


        steps:
          - run: "echo Job ${{ github.job }}"


    job_4: 
        runs-on: ubuntu-latest

        needs: [job_1, job_2, job_3]

        steps: 
          - run: "echo Job ${{ github.job }}"

          - run: "echo Deploying to the ${{ inputs.environments }}"
