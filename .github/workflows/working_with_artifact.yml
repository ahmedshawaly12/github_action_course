on:
    workflow_dispatch:


jobs:
    build:
        runs-on: ubuntu-latest

        steps:
          - uses: actions/checkout@v4
          - run: mkdir dist && echo "app" > dist/app.txt
          - uses: actions/upload-artifact@v4
            with:
                name: dist-output
                path: dist/
                retention-dayes: 5

    publish:
        runs-on: ubuntu-latest
        needs: [build]

        steps:
          - uses: actions/download-artifact@v4
            with:
                name: dist-output
                path: dist/

          - run: ls dist/
          - run: cat dist/app.txt


